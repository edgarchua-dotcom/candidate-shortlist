<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Shortlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card-container {
      perspective: 1000px;
    }
    .swipe-card {
      transition: transform 0.2s ease, opacity 0.2s ease;
      touch-action: none;
      user-select: none;
    }
    .badge-like, .badge-dislike {
      opacity: 0;
      transition: opacity 0.1s ease;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

  <!-- Header -->
  <header class="text-center mb-6">
    <h1 class="text-2xl font-bold text-slate-900">Candidate Shortlist Review</h1>
    <p class="text-sm text-slate-500">Swipe right (or click 👍) to Shortlist | Swipe left (or click 👎) to Pass</p>
  </header>

  <!-- Card Deck Container -->
  <div class="relative w-full max-w-md h-[580px] card-container">
    
    <!-- Empty State (Shown when deck is finished) -->
    <div id="empty-state" class="hidden absolute inset-0 bg-white rounded-2xl shadow-xl flex flex-col items-center justify-center p-6 text-center border border-slate-200">
      <div class="text-5xl mb-4">🎉</div>
      <h2 class="text-xl font-bold text-slate-900 mb-2">All Reviews Complete!</h2>
      <p class="text-slate-600 text-sm mb-6">Thank you for reviewing the candidate pipeline. Your selections have been saved.</p>
      <button onclick="exportResults()" class="bg-indigo-600 text-white font-medium px-5 py-2.5 rounded-lg shadow hover:bg-indigo-700 transition">
        Export / Submit Choices
      </button>
    </div>

    <!-- Cards will be dynamically inserted here -->
    <div id="deck" class="relative w-full h-full"></div>
  </div>

  <!-- Action Buttons -->
  <div class="flex items-center gap-6 mt-6">
    <button onclick="handleButtonAction(false)" class="w-14 h-14 bg-white text-red-500 rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-red-50 border border-slate-200 transition active:scale-95">
      ✕
    </button>
    <button onclick="handleButtonAction(true)" class="w-14 h-14 bg-emerald-500 text-white rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-emerald-600 transition active:scale-95">
      ♥
    </button>
  </div>

  <script>
    // 1. Candidate Data Structure
    const candidates = [
      {
        id: "c1",
        name: "Alex Morgan",
        role: "Senior Product Designer",
        experience: "8 YOE • Ex-Atlassian, Figma Expert",
        alignment: [
          "Proven track record scaling B2B SaaS design systems.",
          "Strong cross-functional collaboration with engineering leads."
        ],
        interviewTopics: [
          "How they handle trade-offs between speed and design debt.",
          "Experience conducting unmoderated user research."
        ],
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400"
      },
      {
        id: "c2",
        name: "Jordan Lee",
        role: "Senior Product Designer",
        experience: "6 YOE • Mobile-First Specialist",
        alignment: [
          "Extensive iOS and Android native design portfolio.",
          "Deep understanding of accessibility standard (WCAG 2.1)."
        ],
        interviewTopics: [
          "Transitioning desktop workflows into mobile native patterns.",
          "Specific quantitative impact of their recent app redesign."
        ],
        avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=400"
      }
    ];

    const results = {};
    let currentIndex = 0;

    const deckElement = document.getElementById("deck");
    const emptyState = document.getElementById("empty-state");

    function renderDeck() {
      deckElement.innerHTML = "";
      if (currentIndex >= candidates.length) {
        emptyState.classList.remove("hidden");
        return;
      }

      // Render top card and next card for smooth stacked look
      for (let i = Math.min(candidates.length - 1, currentIndex + 1); i >= currentIndex; i--) {
        const candidate = candidates[i];
        const isTop = i === currentIndex;
        
        const card = document.createElement("div");
        card.className = `swipe-card absolute inset-0 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col ${isTop ? 'z-10' : 'z-0 scale-95 opacity-50'}`;
        card.id = `card-${i}`;

        card.innerHTML = `
          <div class="relative h-44 bg-slate-800 flex items-end p-4 text-white">
            <img src="${candidate.avatar}" class="absolute inset-0 w-full h-full object-cover opacity-60" />
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
            
            <!-- Swiping Indicators -->
            <div class="badge-like absolute top-4 left-4 border-4 border-emerald-500 text-emerald-500 font-bold px-3 py-1 rounded text-xl transform -rotate-12">SHORTLIST</div>
            <div class="badge-dislike absolute top-4 right-4 border-4 border-red-500 text-red-500 font-bold px-3 py-1 rounded text-xl transform rotate-12">PASS</div>

            <div class="relative z-10">
              <h2 class="text-xl font-bold">${candidate.name}</h2>
              <p class="text-xs text-indigo-300 font-medium">${candidate.role} • ${candidate.experience}</p>
            </div>
          </div>

          <div class="p-5 flex-1 overflow-y-auto space-y-4">
            <div>
              <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-700 mb-1 flex items-center gap-1">
                <span>🎯</span> Role Alignment
              </h3>
              <ul class="text-xs text-slate-600 space-y-1 list-disc list-inside">
                ${candidate.alignment.map(point => `<li>${point}</li>`).join('')}
              </ul>
            </div>

            <div class="border-t border-slate-100 pt-3">
              <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-700 mb-1 flex items-center gap-1">
                <span>💡</span> Worth Interviewing For
              </h3>
              <ul class="text-xs text-slate-600 space-y-1 list-disc list-inside">
                ${candidate.interviewTopics.map(topic => `<li>${topic}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;

        deckElement.appendChild(card);
        if (isTop) setupDrag(card);
      }
    }

    // Touch & Mouse Drag Logic
    function setupDrag(card) {
      let startX = 0, currentX = 0, isDragging = false;
      const likeBadge = card.querySelector('.badge-like');
      const dislikeBadge = card.querySelector('.badge-dislike');

      const onStart = (e) => {
        isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      };

      const onMove = (e) => {
        if (!isDragging) return;
        currentX = (e.type.includes('touch') ? e.touches[0].clientX : e.clientX) - startX;
        const rotate = currentX * 0.05;
        card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;

        // Opacity feedback for badges
        if (currentX > 20) {
          likeBadge.style.opacity = Math.min(currentX / 100, 1);
          dislikeBadge.style.opacity = 0;
        } else if (currentX < -20) {
          dislikeBadge.style.opacity = Math.min(Math.abs(currentX) / 100, 1);
          likeBadge.style.opacity = 0;
        } else {
          likeBadge.style.opacity = 0;
          dislikeBadge.style.opacity = 0;
        }
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        
        if (currentX > 100) {
          completeSwipe(true);
        } else if (currentX < -100) {
          completeSwipe(false);
        } else {
          card.style.transform = '';
          likeBadge.style.opacity = 0;
          dislikeBadge.style.opacity = 0;
        }
      };

      card.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      card.addEventListener('touchstart', onStart);
      window.addEventListener('touchmove', onMove);
      window.addEventListener('touchend', onEnd);
    }

    function completeSwipe(isShortlist) {
      const candidate = candidates[currentIndex];
      results[candidate.id] = { name: candidate.name, status: isShortlist ? 'Shortlisted' : 'Passed' };

      const card = document.getElementById(`card-${currentIndex}`);
      const direction = isShortlist ? 500 : -500;
      card.style.transform = `translateX(${direction}px) rotate(${direction * 0.05}deg)`;
      card.style.opacity = '0';

      setTimeout(() => {
        currentIndex++;
        renderDeck();
      }, 200);
    }

    function handleButtonAction(isShortlist) {
      if (currentIndex < candidates.length) {
        completeSwipe(isShortlist);
      }
    }

    function exportResults() {
      console.log("Hiring Manager Selections:", results);
      alert("Selections captured!\n\n" + JSON.stringify(results, null, 2));
    }

    renderDeck();
  </script>
</body>
</html>
