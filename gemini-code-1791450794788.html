<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Shortlist Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card-container { perspective: 1000px; }
    .swipe-card { transition: transform 0.2s ease, opacity 0.2s ease; touch-action: none; user-select: none; }
    .badge-like, .badge-dislike { opacity: 0; transition: opacity 0.1s ease; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

  <!-- Header -->
  <header class="text-center mb-6">
    <h1 class="text-2xl font-bold text-slate-900">Candidate Shortlist Review</h1>
    <p class="text-xs text-slate-500 mt-1">Swipe right to Shortlist | Swipe left to Pass</p>
  </header>

  <!-- Card Deck Container -->
  <div class="relative w-full max-w-md h-[580px] card-container">
    
    <!-- Empty State -->
    <div id="empty-state" class="hidden absolute inset-0 bg-white rounded-2xl shadow-xl flex flex-col items-center justify-center p-6 text-center border border-slate-200 z-20">
      <div class="text-5xl mb-4">🎉</div>
      <h2 class="text-xl font-bold text-slate-900 mb-2">All Reviews Complete!</h2>
      <p class="text-slate-600 text-sm mb-6">Thank you for reviewing the candidate pipeline. Your selections have been saved directly to Google Sheets.</p>
    </div>

    <!-- Cards Container -->
    <div id="deck" class="relative w-full h-full flex items-center justify-center">
      <p id="loading-state" class="text-slate-500 font-medium animate-pulse">Loading candidate cards...</p>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex items-center gap-6 mt-6">
    <button onclick="handleButtonAction(false)" class="w-14 h-14 bg-white text-red-500 rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-red-50 border border-slate-200 transition active:scale-95">
      ✕
    </button>
    <button onclick="handleButtonAction(true)" class="w-14 h-14 bg-emerald-500 text-white rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-emerald-600 transition active:scale-95">
      ♥
    </button>
  </div>

  <script>
    // Paste your deployed Google Apps Script Web App URL below:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxndofTK_dPjnWvadtrDNQfhIHJBS8_lDt9u-psvzxP2ktyPwV8mF790Xg4VbbXo2yq/exec";

    let candidates = [];
    const results = [];
    let currentIndex = 0;

    const deckElement = document.getElementById("deck");
    const emptyState = document.getElementById("empty-state");

    async function fetchCandidates() {
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        
        // Filter out sheet header row
        candidates = data.filter(c => c.id && c.id.toLowerCase() !== 'id' && c.name.toLowerCase() !== 'name');
        
        if (!candidates || candidates.length === 0) {
          deckElement.innerHTML = `<p class="text-center text-slate-500">No candidate profiles found in Google Sheets.</p>`;
          return;
        }

        renderDeck();
      } catch (err) {
        deckElement.innerHTML = `<p class="text-center text-red-500 px-4">Failed to load candidates. Check your Apps Script permissions.</p>`;
      }
    }

    function renderDeck() {
      deckElement.innerHTML = "";

      if (currentIndex >= candidates.length) {
        emptyState.classList.remove("hidden");
        submitResults();
        return;
      }

      const startIdx = Math.min(candidates.length - 1, currentIndex + 1);
      for (let i = startIdx; i >= currentIndex; i--) {
        const candidate = candidates[i];
        const isTop = (i === currentIndex);
        
        const card = document.createElement("div");
        card.className = `swipe-card absolute inset-0 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col ${isTop ? 'z-10' : 'z-0 scale-95 opacity-50'}`;
        card.id = `card-${i}`;

        // Parse function: Splits exclusively on '•' or newlines and places every point on a new line
        const parseBullets = (data) => {
          if (!data) return '';
          let text = Array.isArray(data) ? data.join('\n') : String(data);
          let items = text.split(/[•\n]/);
          
          return items
            .map(item => item.trim())
            .filter(Boolean)
            .map(item => `<li class="flex items-start gap-2"><span class="text-slate-400 mt-0.5">•</span><span>${item}</span></li>`)
            .join('');
        };

        const alignmentHtml = parseBullets(candidate.alignment);
        const topicHtml = parseBullets(candidate.interviewTopics);
        const experienceHtml = parseBullets(candidate.experience);

        // LinkedIn URL parsing (reads from column G / avatar field)
        const linkedinUrl = (candidate.avatar && candidate.avatar.trim().startsWith('http')) 
          ? candidate.avatar.trim() 
          : null;

        card.innerHTML = `
          <!-- Header Banner -->
          <div class="relative h-28 bg-slate-900 flex items-end p-5 text-white overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-r from-red-600 via-rose-600 to-slate-950 opacity-90"></div>
            
            <div class="badge-like absolute top-3 left-4 border-4 border-emerald-500 text-emerald-500 font-bold px-3 py-1 rounded text-lg transform -rotate-12 z-20">SHORTLIST</div>
            <div class="badge-dislike absolute top-3 right-4 border-4 border-red-500 text-red-500 font-bold px-3 py-1 rounded text-lg transform rotate-12 z-20">PASS</div>

            <div class="relative z-10 w-full flex items-end justify-between">
              <div>
                <h2 class="text-2xl font-bold leading-tight">${candidate.name}</h2>
                <p class="text-xs text-rose-100 font-medium">${candidate.role}</p>
              </div>

              ${linkedinUrl ? `
                <a href="${linkedinUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="bg-white/20 hover:bg-white/30 backdrop-blur-md text-white text-[11px] font-semibold px-2.5 py-1 rounded-md flex items-center gap-1 transition">
                  <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-1.13.71-1.84 1.7-1.84 1.05 0 1.25.8 1.25 1.88v4.89h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
                  LinkedIn ↗
                </a>
              ` : ''}
            </div>
          </div>

          <!-- Body Details Section -->
          <div class="p-5 flex-1 overflow-y-auto space-y-4 text-xs">
            
            <!-- Experience Section -->
            ${experienceHtml ? `
              <div>
                <h3 class="font-bold uppercase tracking-wider text-slate-500 mb-1.5 flex items-center gap-1">
                  <span>💼</span> Experience
                </h3>
                <ul class="text-slate-700 space-y-1.5">
                  ${experienceHtml}
                </ul>
              </div>
            ` : ''}

            <!-- Role Alignment Section -->
            ${alignmentHtml ? `
              <div class="${experienceHtml ? 'border-t border-slate-100 pt-3' : ''}">
                <h3 class="font-bold uppercase tracking-wider text-emerald-700 mb-1.5 flex items-center gap-1">
                  <span>🎯</span> Role Alignment
                </h3>
                <ul class="text-slate-700 space-y-1.5">
                  ${alignmentHtml}
                </ul>
              </div>
            ` : ''}

            <!-- Worth Interviewing For Section -->
            ${topicHtml ? `
              <div class="border-t border-slate-100 pt-3">
                <h3 class="font-bold uppercase tracking-wider text-indigo-700 mb-1.5 flex items-center gap-1">
                  <span>💡</span> Worth Interviewing For
                </h3>
                <ul class="text-slate-700 space-y-1.5">
                  ${topicHtml}
                </ul>
              </div>
            ` : ''}

          </div>
        `;

        deckElement.appendChild(card);
        if (isTop) setupDrag(card);
      }
    }

    function setupDrag(card) {
      let startX = 0, currentX = 0, isDragging = false;
      const likeBadge = card.querySelector('.badge-like');
      const dislikeBadge = card.querySelector('.badge-dislike');

      const onStart = (e) => {
        if (e.target.closest('a')) return;
        isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      };

      const onMove = (e) => {
        if (!isDragging) return;
        currentX = (e.type.includes('touch') ? e.touches[0].clientX : e.clientX) - startX;
        const rotate = currentX * 0.05;
        card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;

        if (currentX > 20) {
          likeBadge.style.opacity = Math.min(currentX / 100, 1);
          dislikeBadge.style.opacity = 0;
        } else if (currentX < -20) {
          dislikeBadge.style.opacity = Math.min(Math.abs(currentX) / 100, 1);
          likeBadge.style.opacity = 0;
        } else {
          likeBadge.style.opacity = 0;
          dislikeBadge.style.opacity = 0;
        }
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        if (currentX > 100) completeSwipe(true);
        else if (currentX < -100) completeSwipe(false);
        else {
          card.style.transform = '';
          likeBadge.style.opacity = 0;
          dislikeBadge.style.opacity = 0;
        }
      };

      card.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
      card.addEventListener('touchstart', onStart);
      window.addEventListener('touchmove', onMove);
      window.addEventListener('touchend', onEnd);
    }

    function completeSwipe(isShortlist) {
      const candidate = candidates[currentIndex];
      results.push({
        id: candidate.id,
        name: candidate.name,
        status: isShortlist ? 'Shortlisted' : 'Passed'
      });

      const card = document.getElementById(`card-${currentIndex}`);
      const direction = isShortlist ? 500 : -500;
      card.style.transform = `translateX(${direction}px) rotate(${direction * 0.05}deg)`;
      card.style.opacity = '0';

      setTimeout(() => {
        currentIndex++;
        renderDeck();
      }, 200);
    }

    function handleButtonAction(isShortlist) {
      if (currentIndex < candidates.length) completeSwipe(isShortlist);
    }

    async function submitResults() {
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decisions: results })
        });
      } catch (err) {
        console.error("Failed to submit choices:", err);
      }
    }

    fetchCandidates();
  </script>
</body>
</html>
